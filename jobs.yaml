name: Job Radar

on:
  schedule:
    - cron: "30 5 * * *"    # 09:00 Tehran — full scan & proposals
    - cron: "30 14 * * *"   # 18:00 Tehran — full scan & proposals
    - cron: "*/30 * * * *"  # every 30 min — process button presses only
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 5 * * *' || github.event.schedule == '30 14 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job radar (full scan)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json jobs.json state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push

  process:
    if: github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process button presses
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CALLBACK_ONLY: "1"
        run: python bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json jobs.json state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push